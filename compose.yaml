services:
  db:
    image: postgres:18.6
    container_name: ordinator-postgres-dev
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ordinator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  localstack:
    container_name: ordinator-localstack-dev
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      SERVICES: s3
      DEBUG: "0"
      PERSISTENCE: "0"
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  localstack_data: